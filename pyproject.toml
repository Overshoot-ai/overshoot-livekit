[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overshoot-livekit"
version = "0.1.0"
description = "Real-time vision for LiveKit agents, powered by Overshoot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "livekit-agents>=1.0",
]
keywords = ["livekit", "vision", "realtime", "agents", "video"]

[project.urls]
Homepage = "https://overshoot.ai"
Documentation = "https://docs.overshoot.ai"

[tool.hatch.build.targets.wheel]
packages = ["src/overshoot_livekit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
